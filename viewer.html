<!DOCTYPE html>
<html>
<head>
    <title>Image Viewer</title>

    <style>

        body{
            margin:0;
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        img{
            max-width:100%;
            max-height:100vh;
            object-fit:contain;
        }

    </style>
</head>

<body>

<img id="img">

<script>

const params =
new URLSearchParams(window.location.search);

const image = params.get("img");

document.getElementById("img").src =
`Images/${image}`;

</script>

</body>
</html>
