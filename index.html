<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
            margin:0;
            padding:20px;
        }

        h1{
            margin-bottom:40px;
        }

        a{
            display:block;
            color:cyan;
            margin:15px;
            font-size:20px;
            text-decoration:none;
            word-break:break-all;
        }

        a:hover{
            color:white;
        }
    </style>
</head>

<body>

<h1>Image Gallery</h1>

<div id="gallery"></div>

<script>

const username = "pskbrothers123-wq";
const repo = "welcome-images";

const api =
`https://api.github.com/repos/${username}/${repo}/contents/Images`;

fetch(api)
.then(res => res.json())
.then(files => {

    const gallery = document.getElementById("gallery");

    files.forEach(file => {

        if(
            file.name.endsWith(".png") ||
            file.name.endsWith(".jpg") ||
            file.name.endsWith(".jpeg") ||
            file.name.endsWith(".webp")
        ){

            const link = document.createElement("a");

            link.href =
                `viewer.html?img=${encodeURIComponent(file.name)}`;

            link.innerText = file.name;

            gallery.appendChild(link);
        }

    });

})
.catch(error => {

    document.body.innerHTML +=
    "<h2>ERROR LOADING IMAGES</h2>";

    console.error(error);

});

</script>

</body>
</html>
