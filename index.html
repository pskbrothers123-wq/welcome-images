<!DOCTYPE html>
<html>
<head>
    <title>Gallery</title>

    <style>
        body{
            background:#111;
            color:white;
            font-family:Arial;
            text-align:center;
        }

        a{
            display:block;
            color:cyan;
            margin:15px;
            font-size:20px;
            text-decoration:none;
        }
    </style>
</head>

<body>

<h1>Image Gallery</h1>

<div id="gallery"></div>

<script>

const username = "YOUR_GITHUB_USERNAME";
const repo = "YOUR_REPOSITORY_NAME";

const api =
`https://api.github.com/repos/${username}/${repo}/contents/images`;

fetch(api)
.then(res => res.json())
.then(files => {

    const gallery = document.getElementById("gallery");

    files.forEach(file => {

        if(
            file.name.endsWith(".png") ||
            file.name.endsWith(".jpg") ||
            file.name.endsWith(".jpeg") ||
            file.name.endsWith(".webp")
        ){

            const link = document.createElement("a");

            link.href =
                `viewer.html?img=${file.name}`;

            link.innerText = file.name;

            gallery.appendChild(link);
        }

    });

});
</script>

</body>
</html>
